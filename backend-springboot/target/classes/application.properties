# Server
server.port=5000




# DataSource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Rentease
spring.datasource.username=root
spring.datasource.password=Gangadharan@05
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver








# JPA / Hibernate
# ddl-auto=update mirrors the Node backend's sequelize.sync({ alter: true }) dev convenience.
# Switch to "validate" + a migration tool (Flyway/Liquibase) for production use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_key_change_this_to_a_long_random_secret_key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS - frontend origin
client.url=${CLIENT_URL:http://localhost:5173}

# Logging
logging.level.com.rentease.backend=INFO
logging.level.org.springframework.web=INFO
